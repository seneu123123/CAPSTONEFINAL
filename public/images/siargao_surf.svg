<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" fill="none">
  <defs>
    <linearGradient id="surfSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#surfSky)" />

  <!-- Cloud 9 Waves -->
  <path d="M0 380 Q 300 200 600 380 T 1200 380 L1200 675 L0 675 Z" fill="url(#waveGrad)" />
  <path d="M0 450 Q 400 300 800 480 T 1200 420 L1200 675 L0 675 Z" fill="#0891b2" opacity="0.8" />

  <!-- White Foam Curve -->
  <path d="M150 380 Q 350 220 500 340" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.8" />

  <!-- Surfer Silhouette -->
  <circle cx="520" cy="300" r="12" fill="#0f172a" />
  <path d="M520 312 L520 340 L505 365 M520 340 L535 365" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />
  <path d="M480 355 L560 350" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" />

  <!-- Overlay Title Card -->
  <rect x="60" y="520" width="520" height="110" rx="16" fill="#090d16" opacity="0.85" />
  <text x="90" y="560" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CLOUD 9 & SUGBA LAGOON</text>
  <text x="90" y="595" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">Siargao Island Surf Expedition</text>
</svg>
